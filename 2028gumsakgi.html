<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2028 대입 전형 검색기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--navy:#0d1b3e;--navy2:#1a2f5e;--blue:#1a3a8f;
--accent:#3b7dd8;--accent2:#5b9cf6;
--gold:#f0b429;--red:#e53e3e;--green:#2d9a5c;--orange:#e07a10;
--bg:#eef2f9;--card:#fff;--border:#cdd7ee;
--text:#0d1b3e;--text2:#4a5578;--tag-bg:#e4ecfb;
--sh:0 2px 10px rgba(13,27,62,.09);--sh2:0 6px 28px rgba(13,27,62,.16)
}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;font-weight:700;background:var(--bg);color:var(--text);min-height:100vh}
.hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);position:sticky;top:0;z-index:200;box-shadow:0 4px 20px rgba(13,27,62,.4)}
.hdr-top{display:flex;align-items:center;padding:10px 16px;gap:12px;border-bottom:1px solid rgba(255,255,255,.1)}
.hdr-logo{width:42px;height:42px;background:var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.hdr-titles{flex:1}
.hdr-title{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.5px}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.6);font-weight:700;margin-top:1px}
.hdr-stats{display:flex;gap:10px}
.stat-p{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:4px 10px;font-size:11px;color:rgba(255,255,255,.88);font-weight:700;white-space:nowrap}
.stat-p span{color:var(--gold);font-size:14px}
.reset-all-btn{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,100,100,.6);color:#fca5a5;border-radius:18px;padding:4px 10px;font-size:11px;font-weight:700;font-family:'Malgun Gothic','맑은 고딕',sans-serif;cursor:pointer;white-space:nowrap;transition:all .18s}
.reset-all-btn:hover{background:var(--red);border-color:var(--red);color:#fff}
.main-tabs{display:flex;gap:6px;padding:10px 16px 0;background:transparent}
.mtab{padding:8px 22px;border-radius:20px 20px 0 0;font-size:13px;font-weight:700;color:rgba(255,255,255,.55);cursor:pointer;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.1);border-bottom:none;transition:all .18s;font-family:'Malgun Gothic','맑은 고딕',sans-serif}
.mtab:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.15)}
.mtab.active{color:var(--navy);background:var(--gold);border-color:var(--gold)}
.rtabs{display:flex;padding:10px 14px;gap:5px;overflow-x:auto;scrollbar-width:none;align-items:center}
.rtabs::-webkit-scrollbar{display:none}
.rtab{padding:6px 14px;font-size:12px;font-weight:700;color:rgba(255,255,255,.55);cursor:pointer;white-space:nowrap;transition:all .18s;background:rgba(255,255,255,.08);border:1.5px solid transparent;border-radius:20px;font-family:'Malgun Gothic','맑은 고딕',sans-serif}
.rtab:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.2)}
.rtab.active{color:var(--navy);background:var(--gold);border-color:var(--gold);box-shadow:0 2px 8px rgba(234,179,8,.35)}
.main{max-width:1400px;margin:0 auto;padding:14px 14px;display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start}
.sidebar{position:sticky;top:152px;display:flex;flex-direction:column;gap:10px;align-self:start}
.sc{background:var(--card);border-radius:13px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--sh)}
.sc-basket{background:var(--card);border-radius:13px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--sh)}
.sc-head{background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:9px 13px;display:flex;align-items:center;gap:6px}
.sg{padding:11px 13px}
.fr{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.fr:last-child{margin-bottom:0}
.fl{font-size:13px;color:var(--text2);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:3px 8px;border-radius:10px;font-size:12px;font-weight:700;background:var(--tag-bg);color:var(--text2);cursor:pointer;border:1.5px solid transparent;transition:all .13s;font-family:'Malgun Gothic','맑은 고딕',sans-serif}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip-elem{background:var(--tag-bg);border:1.5px solid transparent;color:var(--text2);padding:3px 8px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;transition:all .13s;font-family:'Malgun Gothic','맑은 고딕',sans-serif}
.chip-elem:hover{border-color:var(--accent);color:var(--accent);background:#eef2ff}
.chip-elem.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 1px 6px rgba(59,125,216,.3)}
.chip-elem-lg{padding:7px 18px;font-size:13px;border-radius:20px}
.srch{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-weight:700;font-family:'Malgun Gothic','맑은 고딕',sans-serif;color:var(--text);outline:none;transition:border-color .18s}
.srch:focus{border-color:var(--accent)}
.bsk-head{background:var(--gold);color:var(--navy);font-size:12px;font-weight:700;padding:9px 13px;display:flex;align-items:center;justify-content:space-between}
.bsk-cnt{background:var(--navy);color:var(--gold);border-radius:9px;padding:2px 7px;font-size:13px}
.bsk-slots{padding:9px 13px 4px;display:flex;flex-direction:column;gap:5px;max-height:210px;overflow-y:auto;scrollbar-width:thin}
.slot{background:var(--bg);border:1.5px dashed var(--border);border-radius:7px;padding:7px 9px;font-size:13px;color:var(--text2);display:flex;align-items:center;justify-content:space-between;min-height:36px}
.slot.filled{background:#edf2ff;border-color:var(--accent);color:var(--text);border-style:solid}
.slot-univ{font-size:13px;font-weight:700;color:var(--blue)}
.slot-nm{font-size:12px;color:var(--text2);margin-top:1px}
.slot-rm{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;line-height:1;padding:0 2px;font-weight:700}
.bsk-btns{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.cmp-btn{width:100%;padding:10px;background:var(--navy);color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:700;font-family:'Malgun Gothic','맑은 고딕',sans-serif;cursor:pointer;transition:background .18s}
.cmp-btn:hover{background:var(--blue)}
.cmp-btn:disabled{background:var(--border);color:var(--text2);cursor:not-allowed}
.rst-btn{width:100%;padding:8px;background:#fff;color:var(--red);border:1.5px solid var(--red);border-radius:7px;font-size:12px;font-weight:700;font-family:'Malgun Gothic','맑은 고딕',sans-serif;cursor:pointer;transition:all .18s}
.rst-btn:hover{background:var(--red);color:#fff}
.res-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;flex-wrap:wrap;gap:8px}
.res-cnt{font-size:13px;color:var(--text2);font-weight:700}
.res-cnt strong{color:var(--accent);font-size:15px}
.sort-btns{display:flex;gap:3px}
.sb{padding:5px 11px;border-radius:6px;border:1.5px solid var(--border);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;color:var(--text2);font-family:'Malgun Gothic','맑은 고딕',sans-serif;transition:all .13s}
.sb.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.ulist{display:flex;flex-direction:column;gap:9px}
.ucard{background:var(--card);border-radius:12px;border:1.5px solid var(--border);overflow:hidden;box-shadow:var(--sh);transition:box-shadow .18s,border-color .18s}
.ucard:hover{box-shadow:var(--sh2);border-color:var(--accent)}
.uhdr{display:flex;align-items:center;padding:13px 15px;cursor:pointer;gap:11px;user-select:none}
.ubadge{width:38px;height:38px;border-radius:9px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.uinfo{flex:1;min-width:0}
.uname{font-size:15px;font-weight:700;color:var(--text)}
.umeta{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap}
.tag{padding:3px 9px;border-radius:7px;font-size:12px;font-weight:700}
.tag-t{background:#ede9fe;color:#5b21b6}
.tag-r{background:#dbeafe;color:#1e40af}
.tag-c{background:#fef3c7;color:#92400e}
.tag-n{background:#d1fae5;color:#065f46}
.tag-chg{background:#fee2e2;color:#991b1b}
.uexp-btn{background:var(--tag-bg);border:1.5px solid var(--border);border-radius:7px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .18s;flex-shrink:0;color:var(--text2)}
.ucard.open .uexp-btn{background:var(--navy);color:#fff;border-color:var(--navy)}
.card-tabs{display:flex;border-top:1.5px solid var(--border);background:#f0f4fb;padding:8px 12px;gap:6px;align-items:center}
.ctab{padding:5px 15px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s;background:#fff;border:1.5px solid var(--border);border-radius:20px;font-family:'Malgun Gothic','맑은 고딕',sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.ctab:hover{color:var(--blue);border-color:var(--blue);background:#f0f4ff}
.ctab.active{color:#fff!important;background:var(--blue);border-color:var(--blue);box-shadow:0 2px 8px rgba(29,53,133,.25)}
.adm-panel{display:none;border-top:1px solid var(--border)}
.ucard.open .adm-panel.cur{display:block}
.tbl-wrap{overflow-x:auto}
.atbl{width:100%;border-collapse:collapse;font-size:13px}
.atbl thead tr{background:var(--navy);color:#fff}
.atbl th{padding:8px 10px;text-align:left;font-weight:700;font-size:11px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.1)}
.atbl th:last-child{border-right:none}
.atbl tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
.atbl tbody tr:hover{background:#f0f5ff}
.atbl tbody tr:last-child{border-bottom:none}
.atbl td{padding:8px 10px;vertical-align:middle;font-size:12px;font-weight:700;border-right:1px solid var(--border)}
.atbl td:last-child{border-right:none}
.tbadge{display:inline-block;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:700;white-space:nowrap}
.t교과{background:#dbeafe;color:#1e40af}
.t종합{background:#ede9fe;color:#5b21b6}
.t수능{background:#fef3c7;color:#92400e}
.t실기{background:#fce7f3;color:#9d174d}
.t논술{background:#d1fae5;color:#065f46}
.t기타{background:#e5e7eb;color:#374151}
.ti수시{background:#fde68a;color:#78350f}
.ti정시{background:#bfdbfe;color:#1e3a8a}
.m있음{color:var(--red);font-weight:700;font-size:13px}
.m없음{color:#aaa;font-size:13px}
.inum{color:var(--blue);font-weight:700;font-size:14px}
.addbtn{background:none;border:1.5px solid var(--accent);color:var(--accent);border-radius:5px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Malgun Gothic','맑은 고딕',sans-serif;transition:all .13s;white-space:nowrap}
.addbtn:hover{background:var(--accent);color:#fff}
.addbtn.added{background:var(--navy);color:#fff;border-color:var(--navy)}
.chg-panel{padding:12px 16px;display:none}
.ucard.open .chg-panel.cur{display:block}
.chg-item{background:#fff9f0;border:1px solid #fde68a;border-radius:8px;padding:10px 13px;margin-bottom:8px;font-size:13px}
.chg-item:last-child{margin-bottom:0}
.chg-tag{display:inline-block;padding:3px 9px;border-radius:5px;font-size:12px;font-weight:700;background:#fde68a;color:#78350f;margin-right:6px;margin-bottom:4px}
.chg-time{display:inline-block;padding:3px 9px;border-radius:5px;font-size:12px;font-weight:700;background:#dbeafe;color:#1e40af;margin-right:4px}
.chg-cat{font-size:13px;font-weight:700;color:var(--orange);display:block;margin-bottom:3px}
.chg-detail{font-size:13px;color:var(--text);word-break:keep-all;line-height:1.6}
.chg-target{font-size:12px;color:var(--text2);margin-top:2px}
.detail-section{padding:10px 16px 14px;border-top:1px solid var(--border)}
.ds-title{font-size:11px;color:var(--text2);font-weight:700;margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.ds-tbl{width:100%;border-collapse:collapse;font-size:13px}
.ds-tbl th{background:#f0f4fb;padding:5px 9px;font-weight:700;font-size:11px;border:1px solid var(--border);text-align:left;white-space:nowrap}
.ds-tbl td{padding:5px 9px;border:1px solid var(--border);font-size:13px;font-weight:700;word-break:keep-all}
.min-box{background:#fff5f5;border:1px solid #fca5a5;border-radius:6px;padding:6px 9px;margin-top:4px;font-size:13px}
.min-item{margin-bottom:3px;line-height:1.4}
.min-item:last-child{margin-bottom:0}
.moverlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.65);z-index:1000;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto}
.moverlay.open{display:flex}
.modal{background:var(--card);border-radius:15px;width:100%;max-width:1500px;box-shadow:var(--sh2);overflow:visible}
.mhdr{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.mtitle{font-size:15px;font-weight:700}
.mclose{background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:7px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.mbody{overflow:auto;padding:18px;max-height:78vh}
.ctbl{width:100%;border-collapse:collapse}
.ctbl th{background:var(--navy);color:#fff;padding:9px 13px;font-size:11px;font-weight:700;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:4}
.ctbl-uhdr{background:var(--blue);color:#fff;font-size:13px;font-weight:700;padding:11px 13px;text-align:center;border-right:2px solid #fff;position:sticky;top:0;z-index:4}
.ctbl-uhdr:last-child{border-right:none}
.ctbl td{padding:9px 13px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;vertical-align:top}
.ctbl tr:nth-child(even) td{background:#f8faff}
.ctbl .row-lbl{font-weight:700;white-space:nowrap;min-width:80px;color:var(--navy)}
.ctbl .sec-hdr td{background:var(--blue)!important;color:#fff;font-weight:700;font-size:13px;padding:8px 14px;letter-spacing:.3px}
.cmp-body{max-height:75vh;overflow-y:auto}
.nores{text-align:center;padding:50px 20px;color:var(--text2)}
.nores .ico{font-size:44px;margin-bottom:10px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.bsk-bar{background:var(--navy2,#162450);border-bottom:2px solid var(--gold);padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.bsk-bar::-webkit-scrollbar{display:none}
.bsk-bar-label{color:var(--gold);font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0}
.bsk-bar-cnt{background:var(--gold);color:var(--navy);border-radius:8px;padding:2px 7px;font-size:11px;font-weight:700;flex-shrink:0}
.bsk-bar-slots{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
.bsk-bar-slots::-webkit-scrollbar{display:none}
.bsk-bar-slot{background:rgba(255,255,255,.08);border:1.5px dashed rgba(255,255,255,.25);border-radius:7px;padding:4px 10px;font-size:11px;color:rgba(255,255,255,.45);white-space:nowrap;flex:1;min-width:0;text-align:center}
.bsk-bar-slot.filled{background:rgba(91,156,246,.2);border-color:var(--accent2);color:#fff;display:flex;align-items:center;gap:5px;flex:1;min-width:0}
.bsk-bar-slot-txt{display:flex;flex-direction:row;gap:4px;line-height:1.3;align-items:center;overflow:hidden;min-width:0}
.bsk-bar-slot-univ{font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.bsk-bar-slot-nm{font-size:12px;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsk-bar-slot-sep{color:rgba(255,255,255,.4);font-size:12px}
.bsk-bar-slot-rm{background:none;border:none;color:rgba(255,150,150,.8);cursor:pointer;font-size:13px;font-weight:700;padding:0;line-height:1;flex-shrink:0}
.bsk-bar-slot-rm:hover{color:#fff}
.bsk-bar-btns{display:flex;gap:6px;flex-shrink:0}
.bsk-bar-cmp{background:var(--gold);color:var(--navy);border:none;border-radius:7px;padding:6px 14px;font-size:12px;font-weight:700;font-family:'Malgun Gothic','맑은 고딕',sans-serif;cursor:pointer;white-space:nowrap;transition:all .18s}
.bsk-bar-cmp:hover{background:#f9c84a}
.bsk-bar-cmp:disabled{background:rgba(255,255,255,.15);color:rgba(255,255,255,.4);cursor:not-allowed}
.bsk-bar-rst{background:rgba(255,255,255,.08);color:rgba(255,200,200,.8);border:1.5px solid rgba(255,100,100,.4);border-radius:7px;padding:6px 12px;font-size:12px;font-weight:700;font-family:'Malgun Gothic','맑은 고딕',sans-serif;cursor:pointer;white-space:nowrap;transition:all .18s}
.bsk-bar-rst:hover{background:var(--red);border-color:var(--red);color:#fff}
@media(max-width:900px){.main{grid-template-columns:1fr}.sidebar{position:static}.hdr-stats{display:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div class="hdr-logo">🎓</div>
    <div class="hdr-titles">
      <div class="hdr-title">2028학년도 대입 전형 검색기</div>
      <div class="hdr-sub">세솔고 김태진 제작 · 공교육 범위 내 활용 · 수능최저·교과반영·수능반영·변동사항 통합</div>
    </div>
    <div class="hdr-stats">
      <div class="stat-p"><span id="sUniv">-</span> 개 대학</div>
      <div class="stat-p"><span id="sAdm">-</span> 개 전형</div>
      <button class="reset-all-btn" onclick="resetAll()">🔄 전체 초기화</button>
      <button class="reset-all-btn" style="border-color:rgba(100,200,100,.6);color:#86efac" onclick="exportXlsx()">📊 엑셀 내보내기</button>
      <button class="reset-all-btn" style="border-color:rgba(150,150,255,.6);color:#c4b5fd" onclick="printResult()">🖨️ 인쇄</button>
    </div>
  </div>
  <div class="main-tabs">
    <button class="mtab active" id="mtab-univ" onclick="setMainTab('univ')">대학별 검색</button>
    <button class="mtab" id="mtab-elem" onclick="setMainTab('elem')">전형별 검색</button>
  </div>
  <div class="rtabs" id="rTabs"></div>
  <div class="bsk-bar" id="bskBar">
    <div class="bsk-bar-label">📋 비교 바구니</div>
    <div class="bsk-bar-cnt" id="bCnt">0/6</div>
    <div class="bsk-bar-slots" id="bSlots"></div>
    <div class="bsk-bar-btns">
      <button class="bsk-bar-cmp" id="cmpBtn" onclick="openModal()" disabled>📊 전형 비교하기</button>
      <button class="bsk-bar-rst" onclick="resetBasket()">🗑 초기화</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sc">
      <div class="sc-head">🔍 대학·전형 검색</div>
      <div class="sg"><input class="srch" id="srchInp" type="text" placeholder="대학명, 전형명 검색..."></div>
    </div>
    <div class="sc">
      <div class="sc-head">⚙️ 필터</div>
      <div class="sg">
        <div class="fr"><div class="fl">모집 시기</div><div class="chips" id="fTime"></div></div>

  const univs = new Set(RECORDS.map(r=>r['대학교']));
  document.getElementById('sUniv').textContent = univs.size;
  document.getElementById('sAdm').textContent = RECORDS.length;
});

function buildRTabs(){
  const c = document.getElementById('rTabs');
  Object.entries(RGROUPS).forEach(([lbl, regs])=>{
    const btn = document.createElement('button');
    btn.className = 'rtab'+(lbl==='전체'?' active':'');
    let cnt;
    if(lbl==='전체') cnt = new Set(RECORDS.map(r=>r['대학교'])).size;
    else if(lbl==='교대') cnt = new Set(RECORDS.filter(r=>r['분류']==='교대').map(r=>r['대학교'])).size;
    else cnt = new Set(RECORDS.filter(r=>regs.includes(r['지역'])).map(r=>r['대학교'])).size;
    btn.textContent = `${lbl} ${cnt}`;
    btn.onclick = ()=>{
      document.querySelectorAll('.rtab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      ST.region = lbl;
      ST.openUID.clear();
      render();
      if(ST.mainTab==='elem') renderElem();
    };
    c.appendChild(btn);
  });
}

function buildFilters(){

  mkChips('fType', ['교과','종합','수능','논술','실기','기타'], v=>tog('fType', v));

    fc.appendChild(c);
  });

    {key:'논술',  label:'논술',  tip:'논술이 포함된 전형'},
    {key:'실기',  label:'실기',  tip:'실기가 포함된 전형'},
    {key:'수능',  label:'수능',  tip:'수능이 반영된 전형'},
    {key:'면접',  label:'면접',  tip:'면접이 포함된 전형'},
    {key:'출결',  label:'출결',  tip:'출결이 반영되는 전형'},

function mkChips(id, vals, cb){
  const fc = document.getElementById(id);
  vals.forEach(v=>{
    const c = document.createElement('button');
    c.className = 'chip'; c.textContent = v; c.dataset.v = v;
    c.onclick = ()=>{ cb(v); updateChips(); render(); if(ST.mainTab==='elem') renderElem(); };
    fc.appendChild(c);
  });
}

function tog(key, val){
  const a = ST[key]; const i = a.indexOf(val);
  if(i>=0) a.splice(i,1); else a.push(val);
}

function updateChips(){
  document.querySelectorAll('#fTime .chip').forEach(c=>c.classList.toggle('on', ST.fTime.includes(c.dataset.v)));
  document.querySelectorAll('#fType .chip').forEach(c=>c.classList.toggle('on', ST.fType.includes(c.dataset.v)));
  document.querySelectorAll('#fMin .chip').forEach(c=>c.classList.toggle('on', ST.fMin.includes(c.dataset.v)));
  document.querySelectorAll('#fInOut .chip').forEach(c=>c.classList.toggle('on', ST.fInOut.includes(c.dataset.v)));
  document.querySelectorAll('#fCat .chip').forEach(c=>c.classList.toggle('on', ST.fCat.includes(c.dataset.v)));
  document.querySelectorAll('#fElem .chip').forEach(c=>c.classList.toggle('on', ST.fElem.includes(c.dataset.v)));
}

function getFiltered(){
  let data = RECORDS;
  if(ST.region !== '전체'){
    if(ST.region === '교대') data = data.filter(r=>r['분류']==='교대');
    else{ const rgs = RGROUPS[ST.region]||[]; data = data.filter(r=>rgs.includes(r['지역'])); }
  }
  if(ST.search){
    const terms=ST.search.toLowerCase().split(/\s+/).filter(Boolean);
    data=data.filter(r=>{
      const hay=(r['대학교']||'').toLowerCase()+'|'+(r['전형명']||'').toLowerCase()+'|'+(r['전형요소']||'').toLowerCase()+'|'+(r['전형유형']||'').toLowerCase();
      return terms.every(t=>hay.includes(t));
    });
  }
  if(ST.fTime.length) data = data.filter(r=>ST.fTime.some(t=>(r['모집시기']||'').includes(t)));
  if(ST.fType.length){
    data = data.filter(r=>{
      const t = r['전형유형']||'';
      return ST.fType.some(f=>{
        if(f==='논술') return t.includes('논술')||t.includes('논솔');
        return t.includes(f);
      });
    });
  }
  if(ST.fMin.length) data = data.filter(r=>ST.fMin.includes(r['최저기준']));
  if(ST.fInOut.length){
    data = data.filter(r=>{
      if(ST.fInOut.includes('내(정원내)') && r['내외']==='내') return true;
      if(ST.fInOut.includes('외(정원외)') && r['내외']==='외') return true;
      return false;
    });
  }
  if(ST.fCat.length) data = data.filter(r=>ST.fCat.includes(r['분류']));
  if(ST.mainTab==='univ' && ST.fElem && ST.fElem.length){
    const ETEST = {
      '교과':  e=>/교과/.test(e),
      '서류':  e=>/서류/.test(e),
      '논술':  e=>/논술/.test(e),
      '실기':  e=>/실기|전공실기/.test(e),
      '수능':  e=>/수능/.test(e),
      '면접':  e=>/면접/.test(e),
      '출결':  e=>/출결/.test(e),
    };
    data = data.filter(r=>{
      const elem = r['전형요소']||'';
      return ST.fElem.every(key=>ETEST[key]?ETEST[key](elem):true);
    });
  }
  return data;
}

function groupBy(data){
  const map = new Map();
  data.forEach(r=>{
    const k = r['uid']+'_'+r['대학교'];
    if(!map.has(k)) map.set(k,{uid:r['uid'],univ:r['대학교'],region:r['지역'],분류:r['분류'],rows:[]});
    map.get(k).rows.push(r);
  });
  return [...map.values()];
}

function sortU(us){
  const s = ST.sort;
  if(s==='alpha') return [...us].sort((a,b)=>a.univ.localeCompare(b.univ,'ko'));
  if(s==='count') return [...us].sort((a,b)=>b.rows.length-a.rows.length);
  if(s==='region') return [...us].sort((a,b)=>a.region.localeCompare(b.region,'ko')||a.univ.localeCompare(b.univ,'ko'));
  return us;
}

function render(){
  const filtered = getFiltered();
  const grouped = groupBy(filtered);
  const sorted = sortU(grouped);
  document.getElementById('resCnt').innerHTML = `<strong>${sorted.length}</strong>개 대학 · <strong>${filtered.length}</strong>개 전형`;
  const list = document.getElementById('uList');
  if(!sorted.length){
    list.innerHTML = '<div class="nores"><div class="ico">🔍</div><p>검색 결과가 없습니다</p></div>';
    return;
  }
  list.innerHTML = '';
  sorted.forEach(u=>list.appendChild(mkCard(u)));
}

function mkCard(u){
  const div = document.createElement('div');
  div.className = 'ucard'+(ST.openUID.has(u.uid)?' open':'');
  div.id = 'uc_'+u.uid;

  const catLbl = CAT_LBL[u.분류]||u.분류||'';
  const hasChg = !!(CHANGES[u.univ]?.length);
  const curTab = ST.openTab[u.uid] || '전형정보';
  const isOpen = ST.openUID.has(u.uid);

  
  const tabs = ['전형정보'];
  if(hasChg) tabs.push('변동사항');
  
  if(u.rows.some(r=>getEduData(r).length)) tabs.push('교과반영');
  if(u.rows.some(r=>getCsatData(r).length)) tabs.push('수능반영');

  div.innerHTML = `
    <div class="uhdr" onclick="toggleCard('${u.uid}')">
      <div class="ubadge">${u.univ.charAt(0)}</div>
      <div class="uinfo">
        <div class="uname">${u.univ}</div>
        <div class="umeta">
          <span class="tag tag-r">📍 ${u.region}</span>
          ${catLbl?`<span class="tag tag-c">${catLbl}</span>`:''}
          <span class="tag tag-n">${u.rows.length}개 전형</span>
          ${hasChg?`<span class="tag tag-chg">⚡ 변동사항</span>`:''}
        </div>
      </div>
      <div class="uexp-btn">${isOpen?'▲':'▼'}</div>
    </div>
    ${isOpen ? `
    <div class="card-tabs">
      ${tabs.map(t=>`<button class="ctab${t===curTab?' active':''}" onclick="setTab('${u.uid}','${t}',event)">${
        t==='전형정보'?`📋 전형정보`:
        t==='변동사항'?`⚡ 변동사항`:
        t==='교과반영'?`📚 교과반영`:
        `📊 수능반영`
      }</button>`).join('')}
    </div>
    <div class="adm-panel${curTab==='전형정보'?' cur':''}">
      <div class="tbl-wrap">${mkATable(u)}</div>
    </div>
    <div class="chg-panel${curTab==='변동사항'?' cur':''}">
      ${mkChgPanel(u.univ)}
    </div>
    ${tabs.includes('교과반영')?`<div class="adm-panel${curTab==='교과반영'?' cur':''}"><div class="tbl-wrap">${mkEduTable(u)}</div></div>`:''}
    ${tabs.includes('수능반영')?`<div class="adm-panel${curTab==='수능반영'?' cur':''}"><div class="tbl-wrap">${mkCsatTable(u)}</div></div>`:''}
    ` : ''}
  `;
  return div;
}

function toggleCard(uid){
  if(ST.openUID.has(uid)) ST.openUID.delete(uid);
  else ST.openUID.add(uid);
  render();
}

function goToUniv(uid, admName){
  
  setMainTab('univ');
  
  ST.openUID.add(uid);
  
  ST.search = '';
  document.getElementById('srchInp').value = '';
  
  render();
  
  requestAnimationFrame(()=>{
    const card = document.getElementById('uc_'+uid);
    if(card){
      // 헤더 높이만큼 오프셋 적용
      const hdr = document.querySelector('.hdr');
      const hdrH = hdr ? hdr.offsetHeight : 120;
      const cardTop = card.getBoundingClientRect().top + window.scrollY;
      window.scrollTo({top: cardTop - hdrH - 12, behavior:'smooth'});
      
      if(admName){
        const rows = card.querySelectorAll('tr');
        rows.forEach(row=>{
          const nameCell = row.querySelector('td:nth-child(4)');
          if(nameCell && nameCell.textContent.trim()===admName){
            row.style.background='#fef9c3';
            row.style.transition='background 2s';
            setTimeout(()=>{ row.style.background=''; }, 2500);
          }
        });
      }
    }
  });
}

function setTab(uid, tab, e){
  e && e.stopPropagation();
  ST.openTab[uid] = tab;
  render();
}

        minDetail = `<div class="m있음">복수기준</div><div style="font-size:11px;color:#666">${items.length}종</div>`;
      }
    }

    h += `<tr>

      <td style="text-align:center">

          ${isAdded?'✓담김':'＋담기'}

    if(getMinData(r).length > 1){
      h += `<tr><td colspan="9" style="padding:0 11px 8px;background:#fff9f9">
        <div style="font-size:13px;color:#991b1b;font-weight:700;margin-bottom:4px">▶ 수능최저 세부 기준</div>
        ${getMinData(r).map(m=>`
          <div style="font-size:13px;padding:3px 0;border-bottom:1px solid #fee2e2;display:flex;gap:8px;align-items:center">
            <span style="color:#991b1b;font-weight:700;min-width:120px">${m['기준']||''}</span>
            ${m['학과']?`<span style="color:#4a5578">${m['학과']}</span>`:''}

            ${m['사과']?`<span style="color:#666">사/과:${m['사과']}</span>`:''}

function typeClass(t){
  if(!t) return 't기타';
  if(t.includes('교과')) return 't교과';
  if(t.includes('종합')) return 't종합';
  if(t.includes('수능')) return 't수능';
  if(t.includes('논술')||t.includes('논솔')) return 't논술';
  if(t.includes('실기')) return 't실기';
  return 't기타';
}

function esc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

function getMinData(r){ return r['수능최저상세'] || []; }
function getEduData(r){ return EDU[r['uid']] || []; }
function getCsatData(r){ return CSAT[r['uid']] || []; }

  document.getElementById('uList').style.display    = tab==='univ' ? '' : 'none';
  document.getElementById('elemView').style.display = tab==='elem' ? '' : 'none';
  
  document.getElementById('rTabs').style.opacity = '1';
  
  if(tab==='elem') renderElem();
  else render();
}

function renderElem(){
  const view = document.getElementById('elemView');
  const ETEST = {
    '교과':  e=>/교과/.test(e),
    '서류':  e=>/서류/.test(e),
    '논술':  e=>/논술/.test(e),
    '실기':  e=>/실기|전공실기/.test(e),
    '수능':  e=>/수능/.test(e),
    '면접':  e=>/면접/.test(e),
    '출결':  e=>/출결/.test(e),
  };
  const ELEM_BTNS = [
    {key:'교과',  label:'교과'},
    {key:'서류',  label:'서류'},
    {key:'논술',  label:'논술'},
    {key:'실기',  label:'실기'},
    {key:'수능',  label:'수능'},
    {key:'면접',  label:'면접'},
    {key:'출결',  label:'출결'},

    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">`;

  ELEM_BTNS.forEach(({key,label})=>{

  });

  const fElem = ST.fElem||[];

  if(fElem.length){

      const elem = r['전형요소']||'';
      return fElem.every(key=>ETEST[key]?ETEST[key](elem):true);

  const univCnt = new Set(data.map(r=>r['대학교'])).size;

    '<strong>'+univCnt+'</strong>개 대학 · <strong>'+data.length+'</strong>개 전형';

  
  h += '<div style="font-size:13px;color:var(--text2);margin-bottom:10px"><strong style="color:var(--navy)">'+data.length+'</strong>개 전형'+(fElem.length?' <span style="font-size:12px;color:var(--accent)">· '+fElem.join(' + ')+'</span>':'')+'</div>';

  if(!data.length){
    h += `<div style="padding:40px;text-align:center;color:var(--text2)">해당 조건의 전형이 없습니다</div></div>`;
    view.innerHTML = h; return;

  h += `<div class="tbl-wrap"><table class="atbl"><thead><tr>

    <th>선발인원</th><th>전형요소 및 방법</th><th>비교</th><th>수능최저</th>
  </tr></thead><tbody>`;

  data.forEach(r=>{
    const elem = r['전형요소']||'—';
    
    let elemHtml = elem;
    const hlMap = {
      '교과': ['교과','#dcfce7','#166534'],
      '서류': ['서류','#ccfbf1','#065f46'],
      '논술': ['논술','#ede9fe','#5b21b6'],
      '실기': ['실기','#fef3c7','#92400e'],
      '수능': ['수능','#ffedd5','#7c2d12'],
      '면접': ['면접','#dbeafe','#1e40af'],
      '출결': ['출결','#f1f5f9','#334155'],
    };
    fElem.forEach(key=>{
      if(hlMap[key]){
        const [word,bg,color] = hlMap[key];
        const re = new RegExp(word,'g');
        elemHtml = elemHtml.replace(re,`<mark style="background:${bg};color:${color};border-radius:3px;padding:0 2px">${word}</mark>`);
      }
    });

    const t = r['전형유형']||'';
    const tColor = t.includes('교과')?'#166534':t.includes('종합')?'#1e40af':t.includes('수능')?'#7c2d12':t.includes('논술')?'#4c1d95':t.includes('실기')?'#92400e':'#374151';
    const tBg    = t.includes('교과')?'#dcfce7':t.includes('종합')?'#dbeafe':t.includes('수능')?'#ffedd5':t.includes('논술')?'#ede9fe':t.includes('실기')?'#fef3c7':'#f3f4f6';

    h += `<tr>
      <td style="font-weight:700;white-space:nowrap"><span onclick="goToUniv('${r['uid']}','${esc(r['전형명']||'')}')" style="color:var(--blue);cursor:pointer;text-underline-offset:3px">${r['대학교']}</span></td>
      <td style="font-size:12px;color:var(--text2);white-space:nowrap;text-align:center">${r['지역']||''}</td>
      <td style="text-align:center"><span class="tag tag-r">${r['모집시기원']||r['모집시기']}</span></td>
      <td style="text-align:center"><span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:${tBg};color:${tColor}">${t}</span></td>
      <td style="font-weight:700;cursor:pointer;color:var(--navy);white-space:nowrap" onclick="goToUniv('${r['uid']}','${esc(r['전형명']||'')}')">${r['전형명']||''}</td>
      <td style="text-align:center">${r['선발인원']||'—'}</td>
      <td style="font-size:12px;line-height:1.5;max-width:280px;word-break:keep-all">${elemHtml}</td>
      <td style="text-align:center">${(()=>{
        const isIn = ST.basket.some(b=>b.uid===r['uid']&&b.name===r['전형명']&&b.cnt===r['선발인원']);
        const full = !isIn && ST.basket.length>=6;
        const dis  = full ? 'disabled' : '';
        const bs   = isIn ? 'background:var(--blue);color:#fff;border-color:var(--blue)' : 'background:#fff;color:var(--text2);border-color:var(--border)';
        return '<button '+dis+' onclick="elemToggleBasket(this)" data-uid="'+r['uid']+'" data-univ="'+esc(r['대학교'])+'" data-name="'+esc(r['전형명'])+'" data-type="'+esc(r['전형유형'])+'" data-time="'+esc(r['모집시기원']||r['모집시기'])+'" data-cnt="'+esc(r['선발인원'])+'" data-elem="'+esc(r['전형요소']||'')+'" data-min="'+r['최저기준']+'" style="padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;white-space:nowrap;cursor:'+(full?'not-allowed':'pointer')+';border:1.5px solid;'+bs+';opacity:'+(full?'0.4':'1')+';font-family:Malgun Gothic,sans-serif">'+(isIn?'✓담김':'＋담기')+'</button>';
      })()}</td>
            <td style="min-width:160px;font-size:11px;line-height:1.6;vertical-align:middle">${(()=>{
        const items = r['수능최저상세']||[];
        if(!items.length) return r['최저기준']==='있음'
          ? '<span style="color:#991b1b;font-weight:700;font-size:12px">🔴 있음</span>'
          : '<span style="color:#9ca3af;font-size:12px">⚪ 없음</span>';
        const seen=new Set(); let s='';
        items.forEach(m=>{
          const k=(m['학과']||'')+'|'+(m['기준']||'');
          if(seen.has(k))return; seen.add(k);
          s+='<div style="margin-bottom:3px">';
          if(m['학과']) s+='<span style="color:#6b7280;font-size:10px">'+m['학과']+'</span><br>';
          s+='<span style="color:#991b1b;font-weight:700">'+m['기준']+'</span>';
          if(m['탐구']) s+=' <span style="color:#6b7280">[탐구'+m['탐구']+']</span>';
          s+='</div>';
        });
        return s;
      })()}</td>
    </tr>`;
  });

  h += '</tbody></table></div></div>';
  view.innerHTML = h;
}

function toggleElemBtn(key){
  if(!ST.fElem) ST.fElem=[];
  const i = ST.fElem.indexOf(key);
  if(i>=0) ST.fElem.splice(i,1); else ST.fElem.push(key);
  updateChips();
  if(ST.mainTab==='elem') renderElem();
  else render();
}

function setSort(s){
  ST.sort = s;
  document.querySelectorAll('.sb').forEach((b,i)=>b.classList.toggle('active',['alpha','count','region'][i]===s));
  render();
}

function toggleBasket(uid, univ, idx, name, type, time, cnt, elem, min){
  const rid = uid+'_'+idx;
  const ei = ST.basket.findIndex(b=>b.rid===rid);
  if(ei>=0){ ST.basket.splice(ei,1); }
  else{
    if(ST.basket.length>=6){ alert('최대 6개까지 담을 수 있습니다.'); return; }
    ST.basket.push({rid,uid,univ,idx:Number(idx),name,type,time,cnt,elem,min});
  }
  buildSlots();
  render();
}

function elemToggleBasket(btn){
  const uid   = btn.dataset.uid;
  const univ  = btn.dataset.univ;
  const name  = btn.dataset.name;
  const type  = btn.dataset.type;
  const time  = btn.dataset.time;
  const cnt   = btn.dataset.cnt;
  const elem  = btn.dataset.elem;
  const min   = btn.dataset.min;
  const rid   = uid+'_elem_'+name+'_'+time+'_'+cnt;
  const ei    = ST.basket.findIndex(b=>b.rid===rid);
  if(ei>=0){
    ST.basket.splice(ei,1);
  } else {
    if(ST.basket.length>=6){ alert('최대 6개까지 담을 수 있습니다.'); return; }
    ST.basket.push({rid,uid,univ,idx:0,name,type,time,cnt,elem,min});
  }
  buildSlots();
  renderElem();
}

function buildSlots(){
  const c = document.getElementById('bSlots');
  document.getElementById('bCnt').textContent = ST.basket.length+'/6';
  document.getElementById('cmpBtn').disabled = ST.basket.length<2;
  c.innerHTML='';
  for(let i=0;i<6;i++){
    const s = document.createElement('div');
    if(ST.basket[i]){
      const b = ST.basket[i];
      s.className = 'bsk-bar-slot filled';
      s.innerHTML = `<div class="bsk-bar-slot-txt"><div class="bsk-bar-slot-univ">${b.univ}</div><div class="bsk-bar-slot-sep">·</div><div class="bsk-bar-slot-nm">${b.name}</div></div><button class="bsk-bar-slot-rm" onclick="rmSlot(${i})">✕</button>`;
    } else {
      s.className = 'bsk-bar-slot';
      s.textContent = `${i+1}번 슬롯`;
    }
    c.appendChild(s);
  }
}

function rmSlot(i){ ST.basket.splice(i,1); buildSlots(); render(); }
function resetBasket(){ ST.basket=[]; buildSlots(); render(); if(ST.mainTab==='elem') renderElem(); }
function resetAll(){
  ST.region='전체';
  ST.search='';
  ST.fTime=[]; ST.fType=[]; ST.fMin=[]; ST.fInOut=[]; ST.fCat=[]; ST.fElem=[];
  ST.sort='alpha';
  ST.openUID.clear();
  ST.openTab={};
  ST.basket=[];
  document.getElementById('srchInp').value='';
  document.querySelectorAll('.rtab').forEach((b,i)=>b.classList.toggle('active',i===0));
  document.querySelectorAll('.sb').forEach((b,i)=>b.classList.toggle('active',i===0));
  updateChips();
  buildSlots();
  render();
  if(ST.mainTab==='elem') renderElem();
}

function openModal(){
  if(ST.basket.length<2) return;
  const body = document.getElementById('cmpBody');
  const N = ST.basket.length;
  const recs = ST.basket.map(b=>RECORDS.find(rec=>rec['uid']===b.uid && rec['전형명']===b.name));
  const dash = '<span style="color:#bbb">—</span>';

  const sec = (icon, title) =>
    `<tr><td colspan="${N+1}" style="background:var(--blue);color:#fff;font-weight:700;font-size:13px;padding:8px 14px;letter-spacing:.3px">${icon} ${title}</td></tr>`;

  const row = (lbl, cells) => {
    let r = `<tr><td class="row-lbl" style="vertical-align:top">${lbl}</td>`;
    cells.forEach(v=>{ r+=`<td style="vertical-align:top">${v}</td>`; });
    return r+'</tr>';

  let h = `<table class="ctbl"><thead><tr>
    <th style="min-width:80px;position:sticky;left:0;top:0;z-index:5;background:var(--bg2)">항목</th>`;
  ST.basket.forEach(b=>{
    h+=`<th class="ctbl-uhdr">${b.univ}<br><span style="font-size:12px;font-weight:400;opacity:.85">${b.name}</span></th>`;
  });

  h += sec('📋','기본 정보');

      const items = r?.['수능최저상세']||[];
      if(!items.length) return dash;
      const seen=new Set(); let s='';
      items.forEach(m=>{
        const k=(m['학과']||'')+'|'+(m['기준']||'');
        if(seen.has(k))return; seen.add(k);
        s+=`<div style="margin-bottom:6px;padding:5px 8px;background:#fff1f2;border-left:3px solid #f43f5e;border-radius:0 4px 4px 0;font-size:12px">`;
        if(m['학과']) s+=`<div style="color:#9f1239;font-size:11px;margin-bottom:2px">${m['학과']}</div>`;
        s+=`<span style="color:#991b1b;font-weight:700">${m['기준']||''}</span>`;
        if(m['탐구']) s+=` <span style="font-size:11px;color:#6b7280">[탐구: ${m['탐구']}]</span>`;
        if(m['사과']) s+=` <span style="font-size:11px;color:#6b7280">[사/과: ${m['사과']}]</span>`;
        if(m['비고']) s+=`<div style="font-size:11px;color:#9ca3af;margin-top:2px">${m['비고']}</div>`;
        s+=`</div>`;
      });
      return s;
    }));
  }

  
  const hasEdu = recs.some(r=>EDU[r?.['uid']]?.length);
  if(hasEdu){
    h += sec('📚','교과성적 반영방법');

      const items = EDU[r?.['uid']]||[];
      if(!items.length) return dash;
      const seen=new Set(); let s='';
      items.forEach(e=>{
        const k=(e['학과']||'')+'|'+(e['반영지표']||'')+'|'+(e['등급점']||'');
        if(seen.has(k))return; seen.add(k);
        s+=`<div style="margin-bottom:6px;padding:6px 8px;background:#f0fdf4;border-left:3px solid #22c55e;border-radius:0 4px 4px 0;font-size:12px">`;

        s+=`<div><span style="color:#6b7280">지표:</span> ${e['반영지표']||dash}</div>`;
        if(e['등급점']) s+=`<div><span style="color:#6b7280">등급(1→5):</span> <span style="color:#1e40af;font-weight:600">${e['등급점']}</span></div>`;
        if(e['성취점']) s+=`<div><span style="color:#6b7280">성취(A→E):</span> ${e['성취점']}</div>`;
        if(e['졸업생']&&e['졸업생']!=='—'&&e['졸업생']) s+=`<div><span style="color:#6b7280">졸업생:</span> ${e['졸업생']}</div>`;
        if(e['반영제외']&&e['반영제외']!=='—'&&e['반영제외']) s+=`<div style="font-size:11px;color:#9ca3af">제외: ${e['반영제외']}</div>`;
        s+=`</div>`;
      });
      return s;
    }));
  }

  
  const hasCsat = recs.some(r=>CSAT[r?.['uid']]?.length);

      const items = CSAT[r?.['uid']]||[];
      if(!items.length) return dash;
      const seen=new Set(); let s='';
      items.forEach(e=>{

        s+=`<div style="margin-bottom:6px;padding:6px 8px;background:#eff6ff;border-left:3px solid #3b82f6;border-radius:0 4px 4px 0;font-size:12px">`;

        s+=`</div>`;

        s+=`</div>`;

  h+='</tbody></table>';
  body.innerHTML = h;
  document.getElementById('cmpModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(){ document.getElementById('cmpModal').classList.remove('open'); document.body.style.overflow = ''; }
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('cmpModal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
});
</script>
<script>

function exportCmpXlsx(){

      '선발인원':b.cnt||'','전형요소':b.elem||'','수능최저':b.min||'','수능최저기준':min,

}

function printResult(){
  var data=getFiltered();
  if(!data.length){alert('인쇄할 데이터가 없습니다.');return;}
  var grouped=groupBy(data);
  var filterDesc=[];
  if(ST.region!=='전체')filterDesc.push('지역:'+ST.region);
  if(ST.fTime.length)filterDesc.push('시기:'+ST.fTime.join('/'));
  if(ST.fType.length)filterDesc.push('유형:'+ST.fType.join('/'));
  if(ST.fMin.length)filterDesc.push('최저:'+ST.fMin.join('/'));
  if(ST.fElem.length)filterDesc.push('요소:'+ST.fElem.join('+'));
  if(ST.search)filterDesc.push('검색:'+ST.search);
  var rows='';
  grouped.forEach(function(u){
    rows+='<tr><td colspan="6" style="background:#0d1b3e;color:#fff;font-weight:700;padding:5px 8px">'+u.univ+'</td></tr>';
    u.rows.forEach(function(r){
      var min=(r['수능최저상세']||[]).map(function(m){return(m['학과']?m['학과']+':':'')+m['기준'];}).join(' / ')||(r['최저기준']==='있음'?'있음':'—');
      rows+='<tr><td>'+(r['모집시기원']||r['모집시기']||'')+'</td><td>'+(r['전형유형']||'')+'</td><td>'+(r['전형명']||'')+'</td><td style="text-align:center">'+(r['선발인원']||'')+'</td><td>'+(r['전형요소']||'')+'</td><td class="'+(r['최저기준']==='있음'?'min':'')+'">'+min+'</td></tr>';
    });
  });
  var w=window.open('','_blank');
  w.document.open();
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>2028대입전형</title><style>body{font-family:맑은고딕,sans-serif;font-size:11px;margin:15px}table{width:100%;border-collapse:collapse}th{background:#0d1b3e;color:#fff;padding:4px 6px;font-size:10px;text-align:left}td{padding:3px 6px;border-bottom:1px solid #ddd;font-size:11px}.min{color:#991b1b;font-weight:700}@media print{@page{margin:12mm}}</style></head><body><h3>2028학년도 대입 전형 검색기</h3><p style="font-size:10px;color:#666">세솔고 김태진 제작 · '+new Date().toLocaleDateString('ko-KR')+(filterDesc.length?' · '+filterDesc.join(', '):'')+'</p><table><thead><tr><th>시기</th><th>유형</th><th>전형명</th><th>인원</th><th>전형요소</th><th>수능최저</th></tr></thead><tbody>'+rows+'</tbody></table></body></html>');
  w.document.close();
  setTimeout(function(){w.print();},500);
}
